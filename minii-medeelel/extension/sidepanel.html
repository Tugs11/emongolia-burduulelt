<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Миний мэдээлэл AI</title>
<style>
  :root { --bg:#0f1726; --card:#1b2638; --line:#2c3a52; --text:#e8eef8; --muted:#93a3bd; --accent:#2eb87a; --accent2:#4f8cff; --ok:#3ecf8e; --warn:#f5b84a; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  h1 { font-size:17px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .step { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
  button { background:var(--accent2); color:#fff; border:0; border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button:disabled { opacity:.5; cursor:default; }
  #analyze { width:100%; padding:12px; font-size:16px; font-weight:600; background:var(--accent); }
  .small { font-size:12px; }
  .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)} .muted{color:var(--muted)}
  .hidden { display:none; }
  .alert { border-left:3px solid var(--line); padding:6px 10px; margin:8px 0; border-radius:4px; background:#0b1220; }
  .alert.urgent { border-color:var(--err); } .alert.warning { border-color:var(--warn); } .alert.info { border-color:var(--accent2); }
  .alert b { display:block; }
  #messages { display:flex; flex-direction:column; gap:8px; max-height:360px; overflow-y:auto; margin-bottom:8px; }
  .msg { padding:8px 10px; border-radius:10px; max-width:92%; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:var(--accent2); color:#fff; }
  .msg.ai { align-self:flex-start; background:#0b1220; border:1px solid var(--line); }
  .msg.ai a { color:#8fb6ff; display:block; margin-top:4px; font-size:12px; }
  .msg.wide { max-width:100%; white-space:normal; }
  .plan .doc { font-size:13px; margin:4px 0; display:block; cursor:pointer; }
  .plan .doc input { margin:0 6px 0 0; vertical-align:middle; }
  .plan .row { display:flex; flex-wrap:wrap; gap:6px; }
  .plan .bundle { margin-top:8px; padding:8px; border:1px solid var(--accent); border-radius:8px; background:rgba(46,184,122,.08); }
  button.mini { font-size:11px; padding:3px 8px; margin-left:4px; }
  #messages { max-height:520px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chips button { font-size:12px; padding:5px 9px; }
  .ask { display:flex; gap:8px; }
  .ask input { flex:1; background:#0b1220; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
  pre { white-space:pre-wrap; word-break:break-word; font-size:11px; background:#0b1220; padding:8px; border-radius:8px; max-height:240px; overflow:auto; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
  <h1>Миний мэдээлэл AI</h1>
  <div class="sub">e-Mongolia-д нэвтэрсний дараа «Шинжлэх» дарна. Таны ЭМД, НДШ, зээл, бичиг баримт, хөрөнгийн мэдээллийг татаж AI-аар хураангуйлна.</div>

  <div class="card">
    <button id="analyze">Шинжлэх</button>
    <div id="status" class="small muted" style="margin-top:8px"></div>
    <button id="openEm" class="ghost small hidden" style="margin-top:8px">e-Mongolia нээх</button>
  </div>

  <div id="summaryCard" class="card hidden">
    <div class="step">Хураангуй</div>
    <div id="summary"></div>
  </div>

  <div id="chatCard" class="card hidden">
    <div class="step">Асуулт асуух</div>
    <div id="messages"></div>
    <div id="chips" class="chips"></div>
    <form id="askForm" class="ask">
      <input id="question" placeholder="Жишээ нь: Миний НДШ хэдэн сар төлөгдсөн бэ?" maxlength="500" autocomplete="off">
      <button id="send">Илгээх</button>
    </form>
  </div>

  <details id="detailsBox" class="hidden">
    <summary>Дэлгэрэнгүй: татсан мэдээлэл, AI руу илгээсэн зүйл</summary>
    <div id="sources" class="small" style="margin-top:6px"></div>
    <pre id="preview"></pre>
  </details>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
